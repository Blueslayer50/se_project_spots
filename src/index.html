<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Achieve Greatness" />
    <meta name="author" content="Manvir Sidhu" />
    <meta name="keywords" content="HTML, CSS, Image Sharing" />
    <title>Spots</title>
  </head>

  <body>
    <div class="page">
      <!-- HEADER -->
      <header class="header">
        <img
          src="<%= require('./images/logo.svg') %>"
          alt="Spots"
          class="header__logo"
        />
      </header>

      <!-- MAIN CONTENT -->
      <main class="content">
        <!-- PROFILE SECTION -->
        <section class="profile">
          <div class="profile__avatar-container">
            <img
              src="<%= require('./images/avatar.jpg') %>"
              alt="Profile avatar"
              class="profile__avatar"
            />
            <button class="profile__avatar-button" type="button"></button>
          </div>

          <div class="profile__column">
            <h1 class="profile__name">Bessie Coleman</h1>
            <p class="profile__description">Civil Aviator</p>

            <button class="profile__edit-button" type="button">
              <img
                src="<%= require('./images/edit.svg') %>"
                alt="Edit profile"
              />
              Edit Profile
            </button>
          </div>

          <button class="profile__add-button" type="button">
            <img src="<%= require('./images/plus.svg') %>" alt="New Post" />
            New Post
          </button>
        </section>

        <!-- CARDS SECTION -->
        <section class="cards">
          <ul class="cards__list">
            <template id="card-template">
              <li class="card">
                <button class="card__delete-btn" type="button"></button>
                <img src="#" alt="#" class="card__image" />
                <div class="card__content">
                  <h2 class="card__title"></h2>
                  <button type="button" class="card__like-btn"></button>
                </div>
              </li>
            </template>
          </ul>
        </section>
      </main>

      <!-- FOOTER -->
      <footer class="footer">
        <p class="footer__content">2025© Spots</p>
      </footer>

      <!-- EDIT PROFILE MODAL -->
      <div class="modal" id="edit-profile-modal">
        <div class="modal__container">
          <button type="button" class="modal__close-btn"></button>
          <h2 class="modal__title">Edit profile</h2>

          <form class="modal__form" id="profile-form">
            <label class="modal__label">
              Name
              <input
                id="profile-name-input"
                type="text"
                class="modal__input"
                placeholder="Type your name"
                required
                minlength="2"
                maxlength="40"
              />
              <span class="modal__error" id="profile-name-input-error"></span>
            </label>

            <label class="modal__label">
              Description
              <input
                id="profile-description-input"
                type="text"
                class="modal__input"
                placeholder="Describe yourself"
                required
                minlength="2"
                maxlength="200"
              />
              <span
                class="modal__error"
                id="profile-description-input-error"
              ></span>
            </label>

            <button type="submit" class="modal__submit-btn">Save</button>
          </form>
        </div>
      </div>

      <!-- NEW POST MODAL -->
      <div class="modal" id="new-post-modal">
        <div class="modal__container">
          <button type="button" class="modal__close-btn"></button>
          <h2 class="modal__title">New post</h2>

          <form class="modal__form" id="new-post-form">
            <label class="modal__label">
              Image link
              <input
                id="card-image-input"
                type="url"
                class="modal__input"
                placeholder="Paste a link to the picture"
                required
              />
              <span class="modal__error" id="card-image-input-error"></span>
            </label>

            <label class="modal__label">
              Caption
              <input
                id="caption-input"
                type="text"
                class="modal__input"
                placeholder="Type your caption"
                minlength="2"
                maxlength="30"
                required
              />
              <span class="modal__error" id="caption-input-error"></span>
            </label>

            <button type="submit" class="modal__submit-btn">Save</button>
          </form>
        </div>
      </div>

      <!-- AVATAR MODAL -->
      <div class="modal" id="avatar-modal">
        <div class="modal__container">
          <button type="button" class="modal__close-btn"></button>
          <h2 class="modal__title">Edit avatar</h2>

          <form class="modal__form" id="avatar-form">
            <label class="modal__label">
              Avatar link
              <input
                id="profile-avatar-input"
                type="url"
                class="modal__input"
                placeholder="Paste a link to your new avatar"
                required
              />
              <span class="modal__error" id="profile-avatar-input-error"></span>
            </label>

            <button type="submit" class="modal__submit-btn">Save</button>
          </form>
        </div>
      </div>

      <!-- DELETE MODAL -->
      <div class="modal" id="delete-modal">
        <div class="modal__container">
          <button type="button" class="modal__close-btn"></button>
          <h2 class="modal__title">Are you sure?</h2>

          <div class="modal__button__container">
            <button class="modal__delete-button" type="button">Delete</button>
            <button class="modal__cancel-button" type="button">Cancel</button>
          </div>
        </div>
      </div>

      <!-- PREVIEW MODAL -->
      <div class="modal modal_type_preview" id="preview-modal">
        <div class="modal__image-container">
          <button
            type="button"
            class="modal__close-btn modal__close-btn_type_preview"
          ></button>
          <img src="#" alt="" class="modal__image" />
          <p class="modal__caption"></p>
        </div>
      </div>
    </div>
  </body>
</html>
