<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="description" content="Achieve Greatness"/><meta name="author" content="Manvir Sidhu"/><meta name="keywords" content="HTML, CSS, Image Sharing"/><link rel="shortcut icon" href="favicon.ico" type="image/x-icon"/><title>Spots</title><link rel="icon" href="favicon.ico"><script defer="defer" src="main.js"></script><link href="main.css" rel="stylesheet"></head><body><div class="page"><header class="header"><img src="8650253b58b46f0f1c06.svg" alt="Spots" class="header__logo"/></header><main class="content"><section class="profile"><div class="profile__avatar-container"><img src="2fc47fd8e9a9bcd9612f.jpg" alt="Profile avatar" class="profile__avatar"/> <button class="profile__avatar-button" type="button"></button></div><div class="profile__column"><h1 class="profile__name">Bessie Coleman</h1><p class="profile__description">Civil Aviator</p><button class="profile__edit-button" type="button"><img src="1ecf96fab54a91c898b4.svg" alt="Edit profile"/> Edit Profile</button></div><button class="profile__add-button" type="button"><img src="40608da7369d39bc1077.svg" alt="New Post"/> New Post</button></section><section class="cards"><ul class="cards__list"><template id="card-template"><li class="card"><button class="card__delete-btn" type="button"></button> <img src="#" alt="#" class="card__image"/><div class="card__content"><h2 class="card__title"></h2><button type="button" class="card__like-btn"></button></div></li></template></ul></section></main><footer class="footer"><p class="footer__content">2025© Spots</p></footer><div class="modal" id="edit-profile-modal"><div class="modal__container"><button type="button" class="modal__close-btn"></button><h2 class="modal__title">Edit profile</h2><form class="modal__form" id="profile-form"><label class="modal__label">Name <input id="profile-name-input" class="modal__input" placeholder="Type your name" required minlength="2" maxlength="40"/> <span class="modal__error" id="profile-name-input-error"></span></label> <label class="modal__label">Description <input id="profile-description-input" class="modal__input" placeholder="Describe yourself" required minlength="2" maxlength="200"/> <span class="modal__error" id="profile-description-input-error"></span></label> <button type="submit" class="modal__submit-btn">Save</button></form></div></div><div class="modal" id="new-post-modal"><div class="modal__container"><button type="button" class="modal__close-btn"></button><h2 class="modal__title">New post</h2><form class="modal__form" id="new-post-form"><label class="modal__label">Image link <input id="card-image-input" type="url" class="modal__input" placeholder="Paste a link to the picture" required/> <span class="modal__error" id="card-image-input-error"></span></label> <label class="modal__label">Caption <input id="card-description-input" class="modal__input" placeholder="Type your caption" minlength="2" maxlength="30"/> <span class="modal__error" id="card-description-input-error"></span></label> <button type="submit" class="modal__submit-btn">Save</button></form></div></div><div class="modal modal_type_preview" id="preview-modal"><div class="modal__image-container"><button type="button" class="modal__close-btn modal__close-btn_type_preview"></button> <img src="#" alt="" class="modal__image"/><p class="modal__caption"></p></div></div></div></body></html>
